# Prometheus-Konfiguration des monitoring-Profils.
# Scrapt die Kern-Metriken (/metrics, Issue #7) im Compose-Netz.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: stellwerk-core
    metrics_path: /metrics
    static_configs:
      - targets: ["core:8000"]
        labels:
          service: core

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

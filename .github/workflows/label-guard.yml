name: Label Guard

# Ergänzt AK aus Issue #2: Ein Issue ohne module:*-Label bekommt automatisch
# 'triage' plus einen Hinweis-Kommentar. Läuft nur auf Issues (nicht PRs).

on:
  issues:
    types: [opened, reopened, edited, unlabeled, demilestoned, labeled]

permissions:
  issues: write

concurrency:
  group: label-guard-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure module label or apply triage
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const hasModule = labels.some(name => name && name.startsWith('module:'));

            if (hasModule) {
              // Alles gut – falls triage noch klebt, aber jetzt ein Modul da ist: entfernen.
              if (labels.includes('triage')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'triage',
                }).catch(() => {});
              }
              return;
            }

            // Kein module:*-Label -> triage setzen (idempotent).
            if (!labels.includes('triage')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['triage'],
              });
            }

            // Hinweis-Kommentar nur einmal (Marker erkennen).
            const marker = '<!-- label-guard -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const already = comments.some(c => c.body && c.body.includes(marker));
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n⚠️ Diesem Issue fehlt ein \`module:*\`-Label. Es wurde automatisch \`triage\` gesetzt.\n\nBitte vor der Bearbeitung einordnen: eines von \`module:platform\`, \`module:core\`, \`module:pms\`, \`module:idp\`, \`module:leitstand\`, \`module:rag\`, \`module:flow\` vergeben (dann entfernt sich \`triage\` automatisch).`,
              });
            }
